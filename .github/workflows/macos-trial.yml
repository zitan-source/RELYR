name: macOS trial

on:
  workflow_dispatch:
  pull_request:
    paths: ["macos/**", ".github/workflows/macos-trial.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile, test, and package Apple Silicon trial
        run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RELYR-Mac-Trial-0.1.0-arm64
          path: |
            .verification/macos/RELYR-Mac-Trial-0.1.0-arm64.zip
            .verification/macos/RELYR-Mac-Trial-0.1.0-arm64.zip.sha256
            .verification/macos/RELYR-Mac-Trial-preview.png
          if-no-files-found: error
          retention-days: 30
