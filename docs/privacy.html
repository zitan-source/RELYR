    <h1>プライバシー</h1>
    <h2>このWebサイトについて</h2>
    <p>このサイトはRELYRを紹介する静的なWebサイトです。このサイト自体にはアクセス解析、広告、Cookie、入力フォームを設置していません。</p>
    <h2>外部サイトへのリンク</h2>
    <p>ダウンロード、ソースコード、支援ページなどのリンク先では、それぞれGitHubまたはKo-fiのプライバシーポリシーが適用されます。</p>
    <h2>RELYRアプリについて</h2>
    <p>RELYRは入力内容を外部サーバーへ送信しません。設定とマクロは利用者のPC内へ保存します。詳細は<a href="https://github.com/zitan-source/RELYR">GitHubリポジトリ</a>をご確認ください。</p>
